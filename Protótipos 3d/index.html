<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloco de Vidro &amp; Isqueiro — TNES</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    font: 12px/1.4 system-ui, sans-serif; color: rgba(0,0,0,.45);
    pointer-events: none; letter-spacing: .04em;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">clique no isqueiro para abrir/fechar &nbsp;·&nbsp; arraste para girar &nbsp;·&nbsp; scroll para zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.2;
controls.maxDistance = 20;

// ========================= BLOCO DE VIDRO =========================
const blockGroup = new THREE.Group();
blockGroup.position.x = -2.05;
scene.add(blockGroup);

new THREE.TextureLoader().load('rio-runner.jpg', tex => {
  tex.colorSpace = THREE.SRGBColorSpace;
  const aspect = tex.image.width / tex.image.height;
  const H = 2.2, W = H * aspect, D = 0.34;

  const glass = new THREE.Mesh(
    new THREE.BoxGeometry(W, H, D),
    new THREE.MeshPhysicalMaterial({
      transmission: 1, roughness: 0.02, ior: 1.49, thickness: 0.12,
      color: 0xffffff, attenuationColor: 0xf2f7f8, attenuationDistance: 4,
      specularIntensity: 1, envMapIntensity: 2.2,
    })
  );
  blockGroup.add(glass);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(glass.geometry),
    new THREE.LineBasicMaterial({ color: 0x8b949c, transparent: true, opacity: 0.55 })
  );
  blockGroup.add(edges);

  // impressão nas duas direções, sem espelhar em nenhuma delas
  const geo = new THREE.PlaneGeometry(W, H);
  const front = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  front.position.z = D / 2 + 0.001;
  blockGroup.add(front);

  const texFlip = tex.clone();
  texFlip.wrapS = THREE.RepeatWrapping;
  texFlip.repeat.x = -1;
  const inner = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ map: texFlip, side: THREE.BackSide }));
  inner.position.z = front.position.z - 0.0005;
  blockGroup.add(inner);
});

// ============================ ISQUEIRO ============================
// proporções de um Zippo: 57 x 38 x 13 mm
const W = 1.47, H = 2.2, D = 0.5, R = 0.12;
const lidH = 0.62;
const seamY = H / 2 - lidH;
const bev = 0.04;
const gap = 0.006;              // meia-fresta entre tampa e corpo

const lighterGroup = new THREE.Group();
lighterGroup.position.x = 1.55;
scene.add(lighterGroup);

const paint = new THREE.MeshPhysicalMaterial({
  color: 0x0b0b0d, roughness: 0.22, metalness: 0.4,
  clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.2,
});
const metal = new THREE.MeshStandardMaterial({
  color: 0xb9bcc0, roughness: 0.35, metalness: 1,
});

// retângulo arredondado com raios independentes embaixo/em cima,
// em coordenadas absolutas (y0..y1)
function roundRect(x0, y0, x1, y1, rb, rt) {
  const s = new THREE.Shape();
  s.moveTo(x0 + rb, y0);
  s.lineTo(x1 - rb, y0); s.quadraticCurveTo(x1, y0, x1, y0 + rb);
  s.lineTo(x1, y1 - rt); s.quadraticCurveTo(x1, y1, x1 - rt, y1);
  s.lineTo(x0 + rt, y1); s.quadraticCurveTo(x0, y1, x0, y1 - rt);
  s.lineTo(x0, y0 + rb); s.quadraticCurveTo(x0, y0, x0 + rb, y0);
  return s;
}

// extrusão com chanfro; contorno final desejado = shape + bevel
function shell(x0, y0, x1, y1, rb, rt) {
  const g = new THREE.ExtrudeGeometry(
    roundRect(x0 + bev, y0 + bev, x1 - bev, y1 - bev, Math.max(rb - bev, 0.01), Math.max(rt - bev, 0.01)),
    { depth: D - 2 * bev, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 4, curveSegments: 16 }
  );
  g.translate(0, 0, -(D - 2 * bev) / 2);
  return g;
}

// mapeia UVs (coords do shape) para 0..1 da face inteira do isqueiro
function faceUVs(g, fw, fh) {
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++)
    uv.setXY(i, uv.getX(i) / fw + 0.5, uv.getY(i) / fh + 0.5);
}

// corpo (parte de baixo)
const body = new THREE.Mesh(shell(-W / 2, -H / 2, W / 2, seamY - gap, R, 0.02), paint);
lighterGroup.add(body);

// tampa, articulada num grupo com pivô na dobradiça (lateral direita)
const pivot = new THREE.Vector3(W / 2 - 0.02, seamY, 0);
const lidGroup = new THREE.Group();
lidGroup.position.copy(pivot);
lighterGroup.add(lidGroup);

const lid = new THREE.Mesh(shell(-W / 2, seamY + gap, W / 2, H / 2, 0.02, R), paint);
lid.position.set(-pivot.x, -pivot.y, 0);
lidGroup.add(lid);

// interior da tampa: cavidade metálica
const lidInner = new THREE.Mesh(
  new RoundedBoxGeometry(W - 0.22, lidH - 0.14, D - 0.22, 2, 0.03), metal);
lidInner.position.set(-pivot.x, -pivot.y + seamY + lidH / 2 - 0.04, 0);
lidGroup.add(lidInner);

// dobradiça
const hinge = new THREE.Mesh(new RoundedBoxGeometry(0.07, 0.26, 0.16, 2, 0.03), paint);
hinge.position.set(W / 2 - 0.01, seamY, 0);
lighterGroup.add(hinge);

// metal escovado (usado no insert inteiro)
const brushCv = document.createElement('canvas');
brushCv.width = brushCv.height = 256;
{
  const b = brushCv.getContext('2d');
  b.fillStyle = '#b9bcc0'; b.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 600; i++) {
    b.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(40,42,45,0.05)';
    const y = Math.random() * 256;
    b.beginPath(); b.moveTo(0, y); b.lineTo(256, y + (Math.random() - 0.5) * 3); b.stroke();
  }
}
const brushTex = new THREE.CanvasTexture(brushCv);
brushTex.colorSpace = THREE.SRGBColorSpace;
brushTex.wrapS = brushTex.wrapT = THREE.RepeatWrapping;
metal.map = brushTex;

// topo do insert: preenche a fresta e é o que se vê ao abrir
const plate = new THREE.Mesh(
  new RoundedBoxGeometry(W - 2 * bev - 0.01, 0.12, D - 2 * bev - 0.01, 2, 0.025), metal);
plate.position.y = seamY - 0.055;
lighterGroup.add(plate);

// ---- chaminé (windscreen): paredes finas com furos realmente vazados ----
const chimW = 0.66, chimD = D - 0.26, chimH = 0.46;
const chimney = new THREE.Group();
chimney.position.set(-0.18, seamY + chimH / 2, 0);
lighterGroup.add(chimney);

function holeWallTexture(cols) {
  const cv = document.createElement('canvas');
  cv.width = cols * 34 + 14; cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = '#c3c6ca'; c.fillRect(0, 0, cv.width, 128);
  // sombra sutil na borda de cada furo, para leitura de espessura
  for (let r = 0; r < 2; r++)
    for (let i = 0; i < cols; i++) {
      const x = 24 + i * 34, y = 42 + r * 44;
      c.strokeStyle = 'rgba(30,32,35,0.55)'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(x, y, 10, 0, Math.PI * 2); c.stroke();
    }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  // alpha: furos pretos = vazados
  const av = document.createElement('canvas');
  av.width = cv.width; av.height = 128;
  const a = av.getContext('2d');
  a.fillStyle = '#fff'; a.fillRect(0, 0, av.width, 128);
  a.fillStyle = '#000';
  for (let r = 0; r < 2; r++)
    for (let i = 0; i < cols; i++) {
      a.beginPath(); a.arc(24 + i * 34, 42 + r * 44, 9, 0, Math.PI * 2); a.fill();
    }
  return { map: tex, alphaMap: new THREE.CanvasTexture(av) };
}

function holeWall(width, cols) {
  const { map, alphaMap } = holeWallTexture(cols);
  return new THREE.Mesh(
    new THREE.PlaneGeometry(width, chimH),
    new THREE.MeshStandardMaterial({
      map, alphaMap, alphaTest: 0.5, side: THREE.DoubleSide,
      roughness: 0.35, metalness: 1,
    })
  );
}
const wallF = holeWall(chimW, 6); wallF.position.z = chimD / 2;
const wallB = holeWall(chimW, 6); wallB.position.z = -chimD / 2; wallB.rotation.y = Math.PI;
const wallR = holeWall(chimD, 2); wallR.position.x = chimW / 2; wallR.rotation.y = Math.PI / 2;
const wallL = holeWall(chimD, 2); wallL.position.x = -chimW / 2; wallL.rotation.y = -Math.PI / 2;
chimney.add(wallF, wallB, wallR, wallL);

// colarinho no topo da chaminé (aro com furo, borda enrolada)
const collarShape = roundRect(-chimW / 2 - 0.015, -chimD / 2 - 0.015, chimW / 2 + 0.015, chimD / 2 + 0.015, 0.05, 0.05);
const collarHole = roundRect(-chimW / 2 + 0.02, -chimD / 2 + 0.02, chimW / 2 - 0.02, chimD / 2 - 0.02, 0.04, 0.04);
collarShape.holes.push(collarHole);
const collar = new THREE.Mesh(
  new THREE.ExtrudeGeometry(collarShape, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2, curveSegments: 12 }),
  metal
);
collar.rotation.x = -Math.PI / 2;
collar.position.y = chimH / 2 - 0.015;
chimney.add(collar);

// pavio dentro da chaminé, visível pelos furos e por cima
const wick = new THREE.Mesh(
  new THREE.CylinderGeometry(0.042, 0.038, 0.34, 16),
  new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.95 })
);
wick.position.y = 0.03;
chimney.add(wick);

// ---- conjunto da rodinha da pedra (flint wheel) ----
const wheelGroup = new THREE.Group();
wheelGroup.position.set(0.34, seamY + 0.15, 0);
lighterGroup.add(wheelGroup);

// serrilhado cruzado na superfície da rodinha
const knurlCv = document.createElement('canvas');
knurlCv.width = 128; knurlCv.height = 64;
{
  const k = knurlCv.getContext('2d');
  k.fillStyle = '#7a7d81'; k.fillRect(0, 0, 128, 64);
  k.lineWidth = 2;
  for (let x = -64; x < 192; x += 9) {
    k.strokeStyle = 'rgba(25,27,30,0.7)';
    k.beginPath(); k.moveTo(x, 0); k.lineTo(x + 64, 64); k.stroke();
    k.beginPath(); k.moveTo(x + 64, 0); k.lineTo(x, 64); k.stroke();
  }
}
const knurlTex = new THREE.CanvasTexture(knurlCv);
knurlTex.colorSpace = THREE.SRGBColorSpace;
knurlTex.wrapS = THREE.RepeatWrapping;
knurlTex.repeat.x = 5;
const wheelSideMat = new THREE.MeshStandardMaterial({ map: knurlTex, roughness: 0.5, metalness: 1 });
// tampa da rodinha com raios gravados, como a peça estampada real
const capCv = document.createElement('canvas');
capCv.width = capCv.height = 128;
{
  const c = capCv.getContext('2d');
  c.fillStyle = '#63666a'; c.fillRect(0, 0, 128, 128);
  c.strokeStyle = 'rgba(30,32,35,0.6)'; c.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    c.beginPath(); c.moveTo(64 + Math.cos(a) * 14, 64 + Math.sin(a) * 14);
    c.lineTo(64 + Math.cos(a) * 58, 64 + Math.sin(a) * 58); c.stroke();
  }
  c.strokeStyle = 'rgba(220,222,225,0.5)';
  c.beginPath(); c.arc(64, 64, 58, 0, Math.PI * 2); c.stroke();
}
const capTex = new THREE.CanvasTexture(capCv);
capTex.colorSpace = THREE.SRGBColorSpace;
const wheelCapMat = new THREE.MeshStandardMaterial({ map: capTex, roughness: 0.45, metalness: 1 });

const wheel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.145, 0.145, 0.095, 48),
  [wheelSideMat, wheelCapMat, wheelCapMat]
);
wheel.rotation.x = Math.PI / 2;
wheelGroup.add(wheel);

// eixo e suportes laterais da rodinha
const axleMat = new THREE.MeshStandardMaterial({ color: 0x53565a, roughness: 0.4, metalness: 1 });
for (const s of [1, -1]) {
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.02, 16), axleMat);
  cap.rotation.x = Math.PI / 2;
  cap.position.z = s * 0.058;
  wheelGroup.add(cap);
  const arm = new THREE.Mesh(new RoundedBoxGeometry(0.06, 0.16, 0.014, 2, 0.006), metal);
  arm.position.set(0, -0.1, s * 0.06);
  wheelGroup.add(arm);
}

// cam da dobradiça (a peça que dá o "click"), entre a rodinha e a dobradiça
const cam = new THREE.Mesh(
  new RoundedBoxGeometry(0.09, 0.16, 0.12, 2, 0.03),
  new THREE.MeshStandardMaterial({ color: 0x3d3f42, roughness: 0.5, metalness: 0.8 })
);
cam.position.set(0.58, seamY + 0.05, 0);
lighterGroup.add(cam);

// ---------------- faces impressas (frente e verso) ----------------
const fW = W - 2 * bev - 0.01;
const fH = H - 2 * bev - 0.01;
const rr = R * 0.8;
const bodyFaceGeo = new THREE.ShapeGeometry(
  roundRect(-fW / 2, -fH / 2, fW / 2, seamY - gap, rr, 0.01), 16);
const lidFaceGeo = new THREE.ShapeGeometry(
  roundRect(-fW / 2, seamY + gap, fW / 2, fH / 2, 0.01, rr), 16);
faceUVs(bodyFaceGeo, fW, fH);
faceUVs(lidFaceGeo, fW, fH);

new THREE.TextureLoader().load('appenzell.webp', t => {
  t.colorSpace = THREE.SRGBColorSpace;
  const img = t.image.width / t.image.height;
  const face = fW / fH;
  if (img > face) { t.repeat.x = face / img; t.offset.x = (1 - t.repeat.x) / 2; }
  else { t.repeat.y = img / face; t.offset.y = (1 - t.repeat.y) / 2; }
  const mat = new THREE.MeshBasicMaterial({ map: t });

  const pBody = new THREE.Mesh(bodyFaceGeo, mat);
  pBody.position.z = D / 2 + 0.001;
  lighterGroup.add(pBody);

  const pLid = new THREE.Mesh(lidFaceGeo, mat);
  pLid.position.set(-pivot.x, -pivot.y, D / 2 + 0.001);
  lidGroup.add(pLid);
});

// verso: logo [O] (Helvetica, como no site) e mensagem
const helv = new FontFace('HelvTNES', 'url(Helvetica-Regular.otf)');
helv.load().then(f => {
  document.fonts.add(f);
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 768;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#0b0b0d'; cx.fillRect(0, 0, 512, 768);
  cx.fillStyle = '#e8e6e1'; cx.textAlign = 'center';
  cx.font = '110px HelvTNES';
  cx.fillText('[O]', 256, 330);
  cx.font = '32px "Courier New", monospace';
  cx.fillText('appenzell, switzerland', 256, 618);
  cx.font = 'bold 30px "Courier New", monospace';
  cx.fillText('@tnes.studio', 256, 664);
  const backTex = new THREE.CanvasTexture(cv);
  backTex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.35, metalness: 0.2 });

  const bBody = new THREE.Mesh(bodyFaceGeo, mat);
  bBody.rotation.y = Math.PI;
  bBody.position.z = -D / 2 - 0.001;
  lighterGroup.add(bBody);

  const bLid = new THREE.Mesh(lidFaceGeo, mat);
  bLid.rotation.y = Math.PI;
  bLid.position.set(-pivot.x, -pivot.y, -D / 2 - 0.001);
  lidGroup.add(bLid);
});

// ---------------- animação de abrir/fechar no clique ----------------
const OPEN_ANGLE = -1.95;          // ~112°, como um Zippo aberto
let open = location.hash.includes('open');
let angle = open ? OPEN_ANGLE : 0;
let animFrom = angle, animTo = angle, animStart = -1;
const raycaster = new THREE.Raycaster();
let downAt = null;
addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  raycaster.setFromCamera(new THREE.Vector2(
    (e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (raycaster.intersectObject(lighterGroup, true).length) {
    open = !open;
    animFrom = angle;
    animTo = open ? OPEN_ANGLE : 0;
    animStart = performance.now();
  }
});

// ---------------- câmera / luz ----------------
const zoomIn = location.hash.includes('zoom');
const dist = zoomIn ? 2.6 : 9;
controls.target.set(zoomIn ? 1.55 : -0.3, zoomIn ? 0.55 : 0, 0);
camera.position.set(controls.target.x + dist * 0.22, controls.target.y + dist * 0.12,
  location.hash.includes('back') ? -dist : dist);
controls.update();

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7);
rim.position.set(-4, 2, -3);
scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (animStart >= 0) {
    const t = Math.min((performance.now() - animStart) / 650, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // ease in/out cúbico
    angle = animFrom + (animTo - animFrom) * e;
    if (t === 1) animStart = -1;
  }
  lidGroup.rotation.z = angle;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>

services:
  - type: web
    name: tnes
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      # single-page app: deep links use ?artwork= on the same index.html
      - type: rewrite
        source: /*
        destination: /index.html

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wall placement lab — TNES.</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Same paper, ink and type as /prototype-3d; restated because these are static files. */
  @font-face { font-family: 'Manrope'; src: url('/fonts/Manrope-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Manrope'; src: url('/fonts/Manrope-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
  :root {
    --paper: #f8f7f4;
    --ink: #0b0b0b;
    --muted: #5d5d5d;
    --line: rgba(11, 11, 11, 0.2);
    --pad-x: clamp(20px, 3.3vw, 52px);
    --pad-y: clamp(20px, 3.4vw, 54px);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 'Manrope', 'Helvetica Neue', Arial, sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: var(--pad-y) var(--pad-x) 0; }
  .logo { font: 500 clamp(26px, 2.4vw, 38px)/1 Helvetica, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.14em; text-decoration: none; }
  nav { display: flex; gap: 18px; }
  nav a, #back { color: var(--muted); text-decoration: none; }
  #back:hover { color: var(--ink); }
  nav a[aria-current], nav a:hover { color: var(--ink); }
  nav a[aria-current] { text-decoration: underline; text-underline-offset: 5px; }

  main { display: grid; gap: 22px; max-width: 620px; padding: clamp(40px, 9vh, 96px) var(--pad-x) var(--pad-y); }
  .eyebrow { margin: 0; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(26px, 3.4vw, 44px); font-weight: 500; line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--ink); border-radius: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .start { width: 100%; min-height: 64px; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; transition: background-color 180ms ease, color 180ms ease; }
  .start:hover, .start:active { background: var(--ink); color: var(--paper); }
  .phone { display: flex; align-items: center; gap: 18px; }
  .phone svg { flex: none; width: 112px; height: 112px; }

  /* In an AR session only this element is on screen, laid over the camera image. */
  #overlay { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; color: #fff; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #hint { margin: 0; padding: max(16px, env(safe-area-inset-top)) var(--pad-x) 16px; background: rgba(11, 11, 11, 0.78); font-size: 16px; line-height: 1.35; text-align: center; text-wrap: balance; }
  #debug { align-self: end; margin: 0; padding: 6px var(--pad-x); font: 11px/1.3 ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, 0.85); background: rgba(11, 11, 11, 0.45); pointer-events: none; }
  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; padding-bottom: env(safe-area-inset-bottom); background: rgba(11, 11, 11, 0.78); }
  .controls button { min-height: 56px; border: 0; color: #fff; font-size: 14px; }
  .controls button:active { background: rgba(255, 255, 255, 0.18); }
  #sim { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  @media (prefers-reduced-motion: reduce) { .start { transition: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <a class="logo" href="/">TNES.</a>
  <a id="back" hidden>back to the work</a>
  <nav id="methods" aria-label="Placement methods">
    <a href="/prototype-3d/1">1</a>
    <a href="/prototype-3d/2">2</a>
    <a href="/prototype-3d/3">3</a>
  </nav>
</header>

<main id="intro">
  <p class="eyebrow" id="number"></p>
  <h1 id="name"></h1>
  <p id="how"></p>
  <button class="start" id="start" type="button" hidden>see it on your wall</button>
  <div class="phone" id="phone" hidden>
    <span id="qr"></span>
    <p>AR opens on a phone. Scan the code to carry on there, at true size.</p>
  </div>
  <p class="muted" id="status">Checking this browser…</p>
  <p class="muted" id="spec"></p>
</main>

<canvas id="sim" hidden></canvas>
<div id="overlay" hidden>
  <p id="hint" aria-live="polite"></p>
  <p id="debug"></p>
  <div class="controls" id="controls">
    <button type="button" data-do="restart">start over</button>
    <button type="button" data-do="farther">into wall</button>
    <button type="button" data-do="closer">off wall</button>
    <button type="button" data-do="exit">exit</button>
  </div>
</div>

<script type="module">
// three.js loads with the page, not on the tap: an AR session may only be requested while the
// tap still counts as a user gesture, and a download in between would let it lapse.
import { METHODS, runSim, runXR } from '/prototype-3d/lab/lab.js'
import { buildUsdz, frameMeshes } from '/prototype-3d/lab/models.js'

const query = new URLSearchParams(location.search)
const $ = (id) => document.getElementById(id)

// ---- what hangs ----
// A work's page links here as /true-size?img=…&w=…&h=…&frame=…&finish=…&title=…&back=…, sizes
// being the print's in centimetres. With no work given, this is the lab and hangs Rio Runner.
// How each finishing sits on the wall, in metres: the moulding's face, how far it stands off
// the wall, and how far the print sits behind a moulding's face.
const FRAMES = {
  regular: { moulding: 0.03, depth: 0.03, recess: 0.008 },
  unframed: { moulding: 0, depth: 0.004 },
  aluminium: { moulding: 0, depth: 0.02 },
  glass: { moulding: 0, depth: 0.025 },
}
const COLORS = { black: 0x0a0a0a, white: 0xf0efeb, unframed: 0xe8e6e1, aluminium: 0xb9bcc0, glass: 0xd4dcdf }
const forWork = query.has('img')
// Everything in the address is somebody's input: sizes are clamped, the picture may only come
// from this site or the studio's image CDN, and the way back may only be a work's own page.
const cm = (name, fallback) => Math.min(300, Math.max(10, Number(query.get(name)) || fallback)) / 100
const allowedImage = (src) => {
  if (!src) return null // an empty address would resolve to this very page
  try {
    const url = new URL(src, location.origin)
    return url.origin === location.origin || (url.protocol === 'https:' && url.hostname === 'cdn.sanity.io') ? url.href : null
  } catch { return null }
}
const frame = Object.hasOwn(FRAMES, query.get('frame')) ? query.get('frame') : 'regular'
const finish = query.get('finish') === 'white' ? 'white' : 'black'
const work = {
  image: allowedImage(query.get('img') ?? '') ?? '/artworks/rio-runner.jpg',
  w: cm('w', 91.44),
  h: cm('h', 60.96),
  ...FRAMES[frame],
  color: COLORS[frame === 'regular' ? finish : frame],
}
const title = forWork ? (query.get('title') ?? '').slice(0, 80) : 'Rio Runner'
const back = /^\/works\/[\w-]+$/.test(query.get('back') ?? '') ? query.get('back') : null
const outer = [work.w + 2 * work.moulding, work.h + 2 * work.moulding].map((m) => Math.round(m * 100))
$('spec').textContent = `${title ? `${title} · ` : ''}${outer[0]} × ${outer[1]} cm on the wall`

// ---- which way of finding the wall ----
// /prototype-3d/1, /2 and /3 serve this page as the lab, one method each. A work's page gets
// method 1, the one the apps that manage plain walls ship; ?method= overrides it for a trial.
const number = location.pathname.match(/\/([123])\/?$/)?.[1] ?? query.get('method') ?? '1'
const method = METHODS[number] ?? METHODS[1]
if (forWork) {
  $('methods').hidden = true
  if (back) Object.assign($('back'), { href: back, hidden: false })
  $('number').textContent = 'See it at true size'
  $('name').textContent = title || 'On your wall'
  document.title = `${title || 'Your wall'} at true size — TNES.`
} else {
  $('number').textContent = `Method ${number} of 3`
  $('name').textContent = method.name
  document.querySelector(`#methods a[href$="/${number}"]`)?.setAttribute('aria-current', 'page')
}
$('how').textContent = method.how

const overlay = $('overlay')
let controls = null
// A tap on a control must not also count as a tap in the room.
$('controls').addEventListener('beforexrselect', (event) => event.preventDefault())
$('controls').addEventListener('click', (event) => {
  const action = event.target.dataset.do
  if (action === 'restart') controls?.restart()
  if (action === 'closer') controls?.nudge(1)
  if (action === 'farther') controls?.nudge(-1)
  if (action === 'exit') controls?.exit()
})
let shown = {}
function onState(s) {
  if (s.hint !== shown.hint) $('hint').textContent = shown.hint = s.hint
  if (s.debug !== shown.debug) $('debug').textContent = shown.debug = s.debug
}
const onStart = (c) => { controls = c }

// ---- iPhone: the same work as a .usdz for AR Quick Look ----
// Safari has no WebXR on phones; Quick Look finds the wall itself. The file is made here, from
// the picture drawn to a canvas, and is ready before the tap that opens it.
const linear = (hex) => [16, 8, 0].map((shift) => { const c = ((hex >> shift) & 255) / 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4 })
async function quickLookFile() {
  const image = new Image()
  image.crossOrigin = 'anonymous'
  image.src = work.image
  await image.decode()
  const scale = Math.min(1, 2048 / Math.max(image.naturalWidth, image.naturalHeight))
  const canvas = document.createElement('canvas')
  canvas.width = Math.round(image.naturalWidth * scale)
  canvas.height = Math.round(image.naturalHeight * scale)
  canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height)
  const jpeg = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9))
  return buildUsdz(frameMeshes(work), new Uint8Array(await jpeg.arrayBuffer()), { bodyColor: linear(work.color) })
}

if (query.has('sim')) {
  // Desktop rehearsal of the same logic in a made-up room; see runSim.
  $('intro').hidden = true
  $('sim').hidden = false
  overlay.hidden = false
  runSim({ method, work, canvas: $('sim'), onState, onStart })
  if (query.has('usdz')) window.usdz = quickLookFile() // lets a test read the file Quick Look would get
} else if (await navigator.xr?.isSessionSupported?.('immersive-ar').catch(() => false)) {
  $('status').textContent = 'The work appears at its real size. Allow the camera when asked.'
  $('start').hidden = false
  $('start').addEventListener('click', async () => {
    overlay.hidden = false
    try {
      await runXR({ method, work, overlay, onState, onStart })
      $('status').textContent = 'Session ended. Start again whenever you like.'
    } catch (error) {
      $('status').textContent = `AR could not start: ${error.message}`
    }
    overlay.hidden = true
    controls = null
  })
} else if (document.createElement('a').relList.supports('ar')) {
  $('how').textContent = 'Your iPhone finds the wall itself. Point the camera at it and move slowly until the work appears, then drag it into place.'
  try {
    const file = URL.createObjectURL(new Blob([await quickLookFile()], { type: 'model/vnd.usdz+zip' }))
    // Quick Look opens from a link marked rel="ar" that holds an image; the fragment locks the size.
    const link = Object.assign(document.createElement('a'), { rel: 'ar', href: `${file}#allowsContentScaling=0`, download: 'true-size.usdz' })
    link.appendChild(document.createElement('img'))
    $('status').textContent = 'The work appears at its real size.'
    $('start').hidden = false
    $('start').addEventListener('click', () => link.click())
  } catch {
    $('status').textContent = 'The work could not be prepared for AR.'
  }
} else if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  $('status').textContent = 'This browser cannot open AR. Use Chrome on Android, with Google Play Services for AR, or Safari on iPhone.'
} else {
  $('status').textContent = ''
  const script = document.createElement('script')
  script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'
  script.onload = () => {
    const qr = window.qrcode(0, 'L')
    qr.addData(location.href)
    qr.make()
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })
    $('phone').hidden = false
  }
  document.head.appendChild(script)
}
</script>
</body>
</html>

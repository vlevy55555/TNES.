<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TNES — quadro na parede (POC de AR)</title>
<style>
  html, body { height: 100%; margin: 0; background: #ecebe7; color: #131313; font: 14px/1.4 Helvetica, Arial, sans-serif; }
  model-viewer { width: 100%; height: 100%; }
  /* Fundo escuro: durante o AR o texto fica por cima da imagem da câmera. */
  #status { position: absolute; left: 0; right: 0; top: 0; margin: 0; padding: 16px; text-align: center; background: rgba(19, 19, 19, .85); color: #fff; }
  button[slot="ar-button"] {
    position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
    padding: 14px 28px; border: 0; background: #131313; color: #fff; font: inherit; letter-spacing: .08em; text-transform: uppercase;
  }
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
</head>
<body>
<!-- O model-viewer só entrega o quadro ao AR do aparelho; ar-placement="wall" pede parede e
     ar-scale="fixed" trava o tamanho real. O GLB é um arquivo estático em metros, gerado por
     scripts/build-ar-glb.mjs, porque o Scene Viewer baixa o modelo por conta própria.
     Ordem no Android: Scene Viewer (o app de AR do Google, com posicionamento vertical) e, se ele
     não existir no aparelho, WebXR dentro do Chrome. No iPhone, Quick Look.
     ponytail: sem ios-src — o model-viewer converte o GLB em USDZ sozinho, e hoje esse USDZ sai com
     ancoragem horizontal (google/model-viewer#3989). Exportar um USDZ próprio é o passo do iPhone. -->
<model-viewer id="mv" src="/prototype-3d/rio-runner-36x24.glb" ar ar-modes="scene-viewer webxr quick-look"
              ar-placement="wall" ar-scale="fixed" camera-controls shadow-intensity="0">
  <button slot="ar-button">Ver na minha parede</button>
  <!-- Dentro do model-viewer de propósito: só os filhos dele continuam visíveis na sessão de AR. -->
  <p id="status">Carregando o quadro…</p>
</model-viewer>

<script type="module">
const mv = document.getElementById('mv')
const status = document.getElementById('status')

// Botão de calibração para comparar os motores no aparelho: ?ar=webxr ou ?ar=scene-viewer força um só.
const forced = new URLSearchParams(location.search).get('ar')
if (forced) mv.setAttribute('ar-modes', forced)

const cm = (m) => Math.round(m * 100)
// No celular não há console: o estado do AR aparece na tela. Os estados de sessão abaixo só existem
// no WebXR (o Scene Viewer é outro app e não devolve nada à página). No WebXR o model-viewer só mostra
// o quadro depois que o aparelho se localiza, e só o leva para a parede quando o ARCore acha um plano
// vertical; até lá ele fica onde a câmera apontava no primeiro quadro.
function show() {
  if (!mv.loaded) return
  const { x: W, y: H } = mv.getDimensions()
  const ar = mv.getAttribute('ar-status')
  const inSession = ar === 'session-started' || ar === 'object-placed'
  status.textContent =
    ar === 'failed' ? 'O AR não abriu neste aparelho (sem ARCore/ARKit ou câmera bloqueada).'
    : inSession && mv.getAttribute('ar-tracking') === 'not-tracking' ? 'Sem rastreamento: o celular não está se localizando. Mais luz, e mire em algo com contraste.'
    : ar === 'object-placed' ? 'Parede encontrada: quadro posicionado. Arraste para mover.'
    : inSession ? 'Procurando a parede: mova o celular devagar para os lados. Até achar, o quadro fica parado onde a câmera apontava ao abrir.'
    : mv.canActivateAR ? `Tamanho real: ${cm(W)} × ${cm(H)} cm. Aponte a câmera para a parede e só então toque no botão.`
    : `Prévia 3D (${cm(W)} × ${cm(H)} cm). O AR abre no celular: Chrome no Android ou Safari no iPhone.`
}
mv.addEventListener('load', show)
mv.addEventListener('ar-status', show)
mv.addEventListener('ar-tracking', show)
mv.addEventListener('error', () => { status.textContent = 'O model-viewer não conseguiu carregar o quadro.' })
</script>
</body>
</html>
